<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho sách - Bookin</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div id="site-header"></div>
<main class="page-main">
<section class="page-title"><span>KHO SÁCH BOOKIN</span><h1>Danh sách sách</h1><p>Tìm kiếm và lọc sách theo nhu cầu của bạn.</p></section>

<section class="library-tools">
    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Tìm theo tên sách, tác giả..."></div>
    <select id="categoryFilter"><option value="">Tất cả thể loại</option></select>
    <select id="statusFilter"><option value="">Tất cả trạng thái</option><option value="available">Còn sách</option><option value="borrowed">Đang mượn</option></select>
</section>

<div class="result-bar"><span id="resultCount"></span><button id="clearFilters" class="clear-btn">Xóa bộ lọc</button></div>
<section id="bookList" class="book-grid full-grid"></section>
<div id="emptyState" class="empty-state hidden"><i class="fa-solid fa-book-open"></i><h2>Không tìm thấy sách</h2><p>Hãy thử từ khóa hoặc thể loại khác.</p></div>
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
<script>initLibraryPage();</script>
</body>
</html>
