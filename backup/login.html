<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#faf8f3">
    <title>Đăng nhập - Bookin Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="register-page login-page">

<div id="site-header"></div>

<main class="register-main">
  <section class="register-layout login-layout" aria-labelledby="loginTitle">
    <div class="register-story login-story">
      <span class="register-eyebrow"><i class="fa-solid fa-book-open"></i> BOOKIN READING CLUB</span>
      <h1>Chào mừng<br><em>bạn trở lại.</em></h1>
      <p>Những câu chuyện hay vẫn đang chờ bạn mở tiếp trang sách.</p>
      <div class="login-reading-list" aria-label="Gợi ý đọc hôm nay">
        <span>GÓC ĐỌC HÔM NAY</span>
        <div><i class="fa-solid fa-book-open" aria-hidden="true"></i><p>Mỗi lần đăng nhập,<br>một hành trình lại tiếp tục.</p></div>
      </div>
      <div class="register-book-art" aria-hidden="true"><i class="fa-solid fa-book-open"></i></div>
    </div>

    <div class="register-panel login-panel">
      <div class="register-panel-heading">
        <span class="register-step">KHÔNG GIAN CỦA BẠN</span>
        <h2 id="loginTitle">Đăng nhập</h2>
        <p>Nhập thông tin tài khoản Bookin của bạn.</p>
      </div>

      <form id="loginForm" class="register-form login-form">
        <label class="register-field" for="loginEmail">
          <span>Email</span>
          <span class="register-input-wrap">
            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
            <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="ban@email.com" aria-describedby="loginEmailFeedback" required>
          </span>
          <span id="loginEmailFeedback" class="user-field-feedback" aria-live="polite"></span>
        </label>

        <label class="register-field" for="loginPassword">
          <span>Mật khẩu</span>
          <span class="register-input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" aria-describedby="loginPasswordFeedback" required>
            <button class="password-toggle" type="button" data-login-password-toggle aria-label="Hiện mật khẩu">
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
          </span>
          <span id="loginPasswordFeedback" class="user-field-feedback" aria-live="polite"></span>
        </label>

        <div class="login-options">
          <label><input type="checkbox" name="remember"><span>Ghi nhớ email</span></label>
          <button type="button" id="forgotPassword">Quên mật khẩu?</button>
        </div>

        <button class="register-submit" type="submit">
          Đăng nhập <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>

        <p id="loginMessage" class="register-message" role="status" aria-live="polite"></p>
      </form>

      <p class="register-login">Chưa tham gia Bookin? <a href="register.html">Tạo tài khoản</a></p>
      <a class="register-back" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quay về trang chủ</a>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="script.js"></script>
</body>
</html>
